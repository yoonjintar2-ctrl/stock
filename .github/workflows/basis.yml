name: nasdaq futures basis
on:
  schedule:
    - cron: '47 21 * * 1-5'
    - cron: '17 23 * * 1-5'
    - cron: '37 3 * * 2-6'
    - cron: '7 9 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: basis
  cancel-in-progress: false
jobs:
  basis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/basis.js
      - run: node tools/money.js
        continue-on-error: true
      - run: |
          git config user.name "card-bot"
          git config user.email "card-bot@users.noreply.github.com"
          git add c/basis.json c/money.json 2>/dev/null; git add c/basis.json
          git diff --cached --quiet || (git commit -m "basis" && git pull --rebase && git push)

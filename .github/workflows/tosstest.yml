name: toss-reach-test
on:
  workflow_dispatch:
    inputs:
      since: {default: '2023-10-20'}
      syms: {default: 'SOXL,TQQQ,KORU,NVDA,TSLA,AMD,PLTR,MU'}
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/min1_fetch.py "${{ inputs.since }}" "${{ inputs.syms }}"
      - uses: actions/upload-artifact@v4
        with: {name: m1, path: m1/, retention-days: 3}

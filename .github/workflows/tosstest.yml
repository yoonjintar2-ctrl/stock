name: toss-reach-test
on:
  workflow_dispatch:
    inputs:
      cmd: {default: 'python3 tools/day_fetch.py tools/swing_syms.txt'}
      dir: {default: 'd1'}
      branch: {default: 'd1data'}
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - run: ${{ inputs.cmd }}
      - run: |
          mkdir /tmp/o && cp ${{ inputs.dir }}/* /tmp/o/ && cd /tmp/o && git init -q -b ${{ inputs.branch }} && git add . && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ${{ inputs.branch }}

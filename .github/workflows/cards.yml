name: live card thumbnails
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cards
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: plan
        id: plan
        run: |
          out=$(node tools/live_cards.js plan)
          echo "$out"
          if [[ "$out" == NEED* ]]; then echo "need=1" >> "$GITHUB_OUTPUT"; fi
      - name: save latest result
        run: |
          git config user.name "card-bot"
          git config user.email "card-bot@users.noreply.github.com"
          git add c/latest.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "latest result" && git push)
      - name: checkout site
        if: steps.plan.outputs.need == '1'
        uses: actions/checkout@v4
        with:
          repository: yoonjintar2-ctrl/yoonjintar2-ctrl.github.io
          path: site
          sparse-checkout: bb/hunter
      - name: build
        if: steps.plan.outputs.need == '1'
        run: |
          sudo apt-get install -y -q fonts-noto-cjk >/dev/null
          npm i --no-save playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          (cd site/bb/hunter && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          node tools/live_cards.js build
          rm -f todo.json
          git config user.name "card-bot"
          git config user.email "card-bot@users.noreply.github.com"
          git add c
          git diff --cached --quiet || (git commit -m "live card thumbnails" && git push)
